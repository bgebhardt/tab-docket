<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Tab Stash</h1>
        <p id="summary" class="summary"></p>
      </div>
      <input id="search" type="search" placeholder="Filter stash…" autocomplete="off" aria-label="Filter stash" />
      <button id="newGroup" class="ghost">＋ New group</button>
    </header>

    <main id="board"></main>
    <p id="hint" class="hint"></p>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toastText"></span>
      <button id="toastUndo" class="ghost">Undo</button>
    </div>

    <script type="module" src="newtab.js"></script>
  </body>
</html>

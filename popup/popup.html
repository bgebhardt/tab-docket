<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stash tab</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <button id="openBoard" class="view" title="Open the stash page">
      <span>View stash</span><span id="boardCount" class="count"></span>
    </button>

    <header>
      <div id="scopes" role="radiogroup" aria-label="What to stash"></div>
      <p id="subject" class="subject"></p>
    </header>

    <input
      id="query"
      type="text"
      placeholder="Pick a group, or type a new name…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Group name"
    />
    <div id="suggest" class="suggest" hidden></div>
    <label class="sortbar">Sort <select id="sort" aria-label="Sort groups"></select></label>
    <ul id="rows" role="listbox" aria-label="Groups"></ul>

    <footer>
      <label><input id="closeAfter" type="checkbox" /> Close tabs after stashing</label>
      <span id="status" role="status" aria-live="polite"></span>

    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
